    </div><div id="authentic-page"><img src="../assets/space-personal.webp" alt="Настоящий SONAR с открытой страницей Байкала"></div><script>
const params=new URLSearchParams(location.search);const chosen=params.get('variant')||'capsule';
fetch('variants.json').then(r=>r.json()).then(items=>{const item=items.find(i=>i.id===chosen)||items[0];document.querySelector('#variant').textContent=item.css;});
const address=document.getElementById('omnibox');if(address){address.value='https://ru.wikipedia.org/wiki/Байкал';address.readOnly=true;}document.querySelectorAll('#toolbar button,#window-controls button').forEach(b=>{b.disabled=true;});const tabs=document.getElementById('tabs');
tabs.querySelectorAll('.tab').forEach((tab,i)=>{tab.draggable=false;tab.tabIndex=i===0?0:-1;tab.setAttribute('role','tab');tab.setAttribute('aria-selected',i===0?'true':'false');});
tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Вкладки SONAR');
function select(tab){tabs.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t===tab);t.setAttribute('aria-selected',String(t===tab));t.tabIndex=t===tab?0:-1;});}
tabs.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(!tab)return;if(e.target.closest('.close')){const next=tab.nextElementSibling||tab.previousElementSibling;tab.remove();if(next&&!tabs.querySelector('.active'))select(next);}else select(tab);});
tabs.addEventListener('keydown',e=>{const list=[...tabs.querySelectorAll('.tab')];const at=list.indexOf(e.target);if(at<0)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=list[(at+(e.key==='ArrowRight'?1:list.length-1))%list.length];select(next);next.focus();}});
const template=tabs.querySelector('.tab').cloneNode(true);const add=document.getElementById('tab-new');if(add)add.onclick=()=>{const tab=template.cloneNode(true);tab.querySelector('.title').textContent='Новая вкладка';tab.removeAttribute('data-id');tab.title='Новая вкладка';tabs.append(tab);select(tab);};
if(params.get('strip')==='1'){document.getElementById('authentic-page').remove();document.getElementById('toolbar')?.remove();}
</script></body></html>
